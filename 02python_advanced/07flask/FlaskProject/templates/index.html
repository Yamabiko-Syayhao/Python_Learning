<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Yumemita</title>
</head>
<body>
    <button onclick="handleK()">测试跨域</button>
    <!-- 有一个按钮 点击一次这个按钮就触发下面这个函数 这个函数名叫handle -->
    <button onclick="handle(1)">get请求无参数</button>
    <button onclick="handle(2)">get请求有参数</button>
    <button onclick="handle(3)">get请求路径参数</button>
    <button onclick="handle(4)">post请求-form</button>
    <button onclick="handle(5)">post请求-json</button>
    <button onclick="handle(6)">put请求</button>
    <button onclick="handle(7)">delete请求</button>



    <script>
        {#测试跨域#}
        function handleK(){
              fetch('http://www.buchouyang.com/stage-api/website/getNewsList',{
                method:'get',
                params:{
                    pageNum:1,
                    pageSize:4,
                    newsType:1
                }
            }).then(res=>res.json())
            .then((res)=>{
                console.log(res,"后端返回的数据");
            })
        }

        function handle(val){
            if(val == 1){

                    // 调接口 调取一个不需要参数的接口api
                    fetch('http://127.0.0.1:5000/api/get',{
                    method:'get'
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })

            }else if(val == 2){
                // 调接口 调取一个需要参数的接口api
                    fetch('http://127.0.0.1:5000/api/getList?userName=admin&passWord=123456',{
                    method:'get'
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })
            }else if(val == 3){
                // 调接口 调取一个路径参数的接口api
                    fetch('http://127.0.0.1:5000/api/list/arl/1234',{
                    method:'get'
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })
            }else if(val == 4){
                // 调接口 调取一个post请求-form的接口api
                    fetch('http://127.0.0.1:5000/api/form',{
                    method:'post',
                    headers:{
                        // 请求头 表单格式
                        "Content-Type":"application/x-www-form-urlencoded"
                    },
                {#请求头#}
                    body:"userName=admin&passWord=123456"
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })
            }else if(val == 5){
                // 调接口 调取一个post请求-json的接口api
                    fetch('http://127.0.0.1:5000/api/data',{
                    method:'post',
                    headers:{
                        // 请求头 json形式
                        "Content-Type":"application/json"
                    },
                {#请求头#}
                        // JSON.stringify() 转为字符串形式
                    body:JSON.stringify(
                        {
                            userName:"val",
                            eat:"饺子"
                        }
                    )
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })
            }else if(val == 6){
                // 调接口 调取一个put请求-json的接口api
                    fetch('http://127.0.0.1:5000/api/put',{
                    method:'put',
                    headers:{
                        // 请求头 json形式
                        "Content-Type":"application/json"
                    },
                        // JSON.stringify() 转为字符串形式
                    body:JSON.stringify(
                        {
                            id:1,
                            userName:"val",
                            eat:"面条"
                        }
                    )
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })
            }else{
                // 调接口 调取一个delete请求-json的接口api
                    fetch('http://127.0.0.1:5000/api/delete',{
                    method:'delete',
                    headers:{
                        // 请求头 json形式
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(
                        {
                            id:1
                        }
                    )
                }).then(res=>res.json())
                .then((res)=>{
                    console.log(res,"后端返回的数据");
                })
            }
        }
    </script>
</body>
</html>
