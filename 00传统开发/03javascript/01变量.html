<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        html 标签可以理解为一个人的躯干
        css 样式 可以理解为化妆品，主要是为了美化标签
        javascript 交互逻辑 可以理解为一个人的技能 主要是操作标签用的
    -->

    <!-- 建议写在body尾巴标签上边 -->
    <script>
        // 变量：就是将一个值存起来 在需要的时候拿出来使用
        // var 变量名 = 值  注意变量名开头不能是数字 希望能见名知意  
        var aa = "今天周二"
        var bb = 6789

        // 在控制台输出    f12/右键 检查
        console.log(aa)
        console.log(bb)
        
    </script>
</body>
</html>
