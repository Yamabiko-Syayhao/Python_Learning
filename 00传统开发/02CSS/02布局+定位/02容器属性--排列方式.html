<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 1000px;
            height: 800px;
            background-color: pink;
            margin: auto;
            /* flex布局 */
            display: flex;
            /* 
                排列方式 flex-direction
                    row:从左往右（默认值）
                    row-reverse 从右往左
                    column 从上往下
                    column-reverse 从下往上
            */
            flex-direction: row-reverse;
        }
        .item{
            width: 100px;
            height: 100px;
            background-color: green;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
