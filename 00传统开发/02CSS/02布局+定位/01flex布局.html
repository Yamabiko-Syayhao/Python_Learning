<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        /* 
            弹性盒子 flex布局就是让元素在一个盒子中实现排列效果
            可以实现儿子不同的排列
        */
        .box{
            width: 1000px;
            height: 400px;
            background-color: pink;
            margin: auto;
            /* 想让五个儿子在同一行显示  那么就给父元素加上display:flex; */
            display: flex;
        }
        .item{
            width: 100px;
            height: 100px;
            background-color: green;
            margin: 10px;
        }
    </style>
</head>
<body>
    <!-- 
        容器：添加了display:flex布局的元素称为容器
        项目：就是添加了flex布局的儿子称为项目
    -->
    <div class="box">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
