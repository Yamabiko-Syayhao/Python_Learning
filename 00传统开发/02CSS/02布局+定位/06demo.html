<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .banner{
            width: 1000px;
            height: 400px;
            background-color: pink;
            margin: 50px auto;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        span{
            width: 30px;
            height: 30px;
            background-color: #fff;
            margin: 0px 5px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <span>1</span>
        <span>2</span>
        <span>3</span>
    </div>
</body>
</html>
