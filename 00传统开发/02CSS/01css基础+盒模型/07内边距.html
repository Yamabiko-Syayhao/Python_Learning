<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内边距</title>
    <style>
        div{
            width: 100px;
            background-color: pink;
            /* padding参数个数代表的方向和margin的一致 */
            /* padding 一个值代表的是上下左右四个方向的内边距 */
            /* padding: 30px; */
            /* padding 两个值 代表的是先上下  再左右 */
            /* padding: 20px 40px; */
            /* padding 三个值  代表的是上  左右  下 */
            /* padding: 20px 40px 60px; */
            /* padding 四个值  代表的是 上右下左 */
            /* padding: 10px 20px 30px 40px; */

            /* 单个设置 分别设置 上 右 下 左内边距 */
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 30px;
            padding-left: 40px;
        }
    </style>
</head>
<body>
    <!-- 内边距：就是标签与内容之间的距离就是内边距 -->
    <div>
        我是一个div
    </div>

</body>
</html>
