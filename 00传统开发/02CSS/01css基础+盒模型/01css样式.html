<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css样式</title>
    <!-- 内嵌式  style是css样式  因为标签自带的某些样式很丑 所以想改的好看一点 -->
    <style>
        div{
            /* 宽度   px是像素  单位 */
            width: 800px;
            /* 高度 */
            height: 200px;
            /* 背景颜色 */
            background-color: pink;
            /* 块中的文字 水平居中 */
            text-align: center;
            /*行高   注意 这种方式只适合单行文本垂直居中  让行高等于这个盒子的高度*/
            line-height: 200px;
            /* 字体大小 */
            font-size: 30px;
            /* 字体加粗  100-900之间的整百数字 除了数字还可以写英文单词  bold  bolder*/
            font-weight: 600;
            /* 让这个块居中 */
            margin: auto;
            /* 字体颜色 */
            color: red;
        }
    </style>
</head>
<body>
    <div>
        好好听课别摸鱼 别想对象
    </div>
</body>
</html>
