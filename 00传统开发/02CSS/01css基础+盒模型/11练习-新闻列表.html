<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻列表练习</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            width: 500px;
            border: 1px solid #ccc;
            margin: auto;
            padding: 20px;
        }
        h1{
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .item{
            border-bottom: 1px dashed #ccc;
            padding: 15px 30px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>最新文章/New Articles</h1>
        <div class="item">北京招聘网页设计、平面设计、php</div>
        <div class="item">体验JavaScript的魅力</div>
        <div class="item">jquery世界来临</div>
        <div class="item">网页设计师的梦想</div>
        <div class="item">jquery中的链式编程是什么?</div>
    </div>
</body>
</html>
