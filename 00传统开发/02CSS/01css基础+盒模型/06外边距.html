<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外边距</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: yellow;
            /* 1.margin如果是一个值 那么代表的是上下左右四个方向的外边距 */
            /* margin: 20px; */
            /* 2.margin如果是两个值 那么代表的是 第一个值代表的是上下外边距  第二个值代表的是左右外边距*/
            /* margin: 20px 40px; */
            /* 3.margin如果是三个值 代表的是上   左右    下*/
            /* margin: 20px 40px 60px; */
            /* 4.margin如果是四个值 代表的是上 右 下 左 */
            /* margin: 20px 40px 60px 80px; */

            /* 单个设置外边距 */
            margin-top: 10px;
            margin-right: 20px;
            margin-bottom: 30px;
            margin-left: 40px;
        }
    </style>
</head>
<body>
    <!-- 外边距：标签和标签之间的距离就是外边距 -->
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
</body>
</html>
