<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签选择器</title>
    <!-- 选择器：就是要选中这个标签 对这个标签进行美化 -->
    <!-- 标签选择器 就是选中页面中所有的这个标签 对其进行美化-->
    <style>
        h1{
            width: 300px;
            background-color: red;
        }
        input{
            height: 200px;
        }
    </style>
</head>
<body>
    <!-- 标签选择器会选中页面中所有的相同标签 -->
    <h1>我是h1标题</h1>
    <h1>我是h1标题</h1>
    <h1>我是h1标题</h1>
    <h1>我是h1标题</h1>
    <div>我是div标签</div>
    <input type="text">
    <button>查询</button>
</body>
</html>
