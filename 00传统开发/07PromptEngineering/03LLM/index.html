<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <button onclick="handleClick(1)">查询1</button>
    <button onclick="handleClick(2)">查询2</button>

    <script>
        function handleClick(item){
            if(item == 1){
                //调接口
                fetch("http://127.0.0.1:5000/api/user?content=你是谁？",{
                    method:"get",
                    headers:{}
                }).then(res=>res.json())
                    .then((data)=>{
                        console.log(data,"后端传递给我的数据")
                    })

            }
            if (item == 2){
                fetch("http://127.0.0.1:5000/api/ai?content=yunos的收货地址在哪",{
                    method:"get"
                }).then(res=>res.json())
                    .then((data)=>{
                        console.log(data,"后端传递给我的数据")
                    })
            }
        }


    </script>
</body>
</html>
