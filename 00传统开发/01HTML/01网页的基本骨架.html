<!DOCTYPE html>
<!-- 
    <!DOCTYPE html> 声明这个网页的版本是h5版本
    <html lang="en"> 声明这个网页的语言是英文  en是英文的缩写  html代表的是html语言
-->
<html lang="en">
<!-- 
    head 头部区域  声明这个网页的头部  里边包含一些元数据 比如说网页的标题 适配 编码格式等等
-->
<head>
    <!-- 编码格式 -->
    <meta charset="UTF-8">
    <!-- 移动端会用到 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网页的标题 -->
    <title>百杉2608</title>
</head>
<!-- 
    网页的身体  所有显示在网页中的内容 都在body中写
    网页是由标签 和 内容组成的
    <标签>
    输入标签比如说h1按下tab键自动补全
-->
<body>
    周四
    <h1>这是个一级标题</h1>
    <!-- 
        
        快捷键
            注释  ctrl + /  （程序员自己看的内容）
            保存  ctrl + s
            剪切  ctrl + x
            全选  ctrl + a
            快速复制一行   alt + shift + 下箭头
            生成基本骨架  英文!然后回车
    -->
</body>
</html>
