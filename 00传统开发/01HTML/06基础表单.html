<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础表单</title>
</head>
<body>
    <!-- 单行文本输入框 -->
     <!-- placeholder属性  占位符 当输入框为空时显示的提示文字 -->
    <input type="text" placeholder="请输入用户名">
    <!-- 密码输入框 -->
    <input type="password" placeholder="请输入密码">

    <!-- button 提交按钮 -->
    <button>提交哈哈</button>
</body>
</html>
