<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标题标签</title>
</head>
<body>
    <!-- 
        标题标签  h1~h6  六个  h1最大  h6最小
        块元素：独占一行  可以设置宽高
    -->
    
    <h1>钱包空空如也</h1>
    <h2>脑袋里满满废话</h2>
    <h3>郭丰照 白天万事不想干 晚上精神永相伴</h3>
    <h4>这是四级标题</h4>
    <h5>这是五级标题</h5>
    <h6>这是六级标题</h6>
</body>
</html>
